case_study:
  published: true
  intro: Workboard is a personal planner where AI plans my day and checks in on me while I work. It only counts time I confirm, so my records stay honest.
  role: Sole engineer
  built: 2026 to now
  problem: |
    I have ADHD, and I lose track of time. I often forget a timer is running. Normal to do apps then record hours I never really worked. My numbers looked good, but they were not true, so I could not plan my days on them.

    I wanted AI to plan my day around my priorities, nudge me when a block starts, and re-plan when I slip. It should only count time I actually confirmed. It is built for me first, and could open to others later.
  steps:
    - At 5:30 each morning, Claude plans my day into 20 to 40 minute blocks, ordered by my priorities, and saves them to the board.
    - Every minute, a clock inside the database runs a check on today's blocks and timers.
    - The check finds a block that is starting, a timer that needs a "Still working?" question, or an ignored timer to stop, and sends the message to the app.
    - The app hands each message to the phone's push service.
    - The notification lands on my phone.
    - One tap starts, confirms or stops the timer in the app.
    - The app saves what happened, counting only confirmed time.
    - Four times a day, Claude reads what happened and re-plans the rest of the day if I have slipped.
  decisions:
    - chose: a scheduled AI that plans my day
      over: planning every morning by hand
      because: Claude builds the day from my priorities before I sit down, and re-plans it when I slip. I only have to start the next block.
    - chose: ending an ignored timer at the last confirmed moment
      over: ending it at the moment it gets stopped
      because: A forgotten timer would add minutes I never worked. Counting only confirmed time keeps my records honest.
    - chose: phone notifications through the browser
      over: building a phone app
      because: One codebase serves both laptop and phone, with no app store in the way. It let me ship in days instead of weeks.
  numbers:
    - value: "19"
      label: Days in daily use
    - value: "336"
      label: Work blocks planned
    - value: "101"
      label: Tasks on the board, across 8 tracks
  now: |
    I use Workboard every day and keep adding to it. Claude now moves block times based on when I actually do my best work. When the day slips, it drops work instead of pushing everything later, so the day still ends on time.

    Two problems shaped it. Timers left running used to inflate my hours, so a timer now stops itself when I stop answering. On iPhone, notifications once stopped arriving without any warning, until I subscribed again.
